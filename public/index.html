<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chef Caseiro — cozinha viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f8f4e6;
    --surface: #fffcf5;
    --surface-alt: #f3e7d0;
    --border: #e4d5b3;
    --ink: #2f2a18;
    --ink-soft: #6c6242;
    --ink-faint: #9c9270;
    --accent: #495733;
    --accent-soft: #657a4b;
    --accent-bg: #ecefe0;
    --gold: #b8934a;
    --gold-bg: #f6ecd6;
    --terracotta: #c96f34;
    --terracotta-bg: #f7e6d6;
    --good: #52713d;
    --good-bg: #e7efdd;
    --warn: #a6790f;
    --warn-bg: #f7ecd4;
    --bad: #a8432f;
    --bad-bg: #f6e2da;
    --radius: 12px;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Manrope", -apple-system, "Segoe UI", sans-serif;
    --sticker-shadow: rgba(80, 51, 20, .28);
    /* A "mesa de acao" (stage) e sempre verde-floresta, por escolha de design —
       nao reage ao tema claro/escuro do sistema. O resto da pagina fica
       sempre claro/quente, servindo de moldura pro card verde se destacar. */
    --stage-bg: #3c4a29;
    --stage-bg-soft: #46562f;
    --stage-ink: #f4efd9;
    --stage-ink-soft: #cdc6a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 var(--font-body);
    background-image:
      radial-gradient(circle at 8% 12%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 40%),
      radial-gradient(circle at 92% 4%, color-mix(in srgb, var(--gold) 8%, transparent), transparent 35%);
  }
  header {
    position: relative; overflow: hidden;
    padding: 26px 28px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header h1 {
    font: 700 32px/1 var(--font-display); margin: 0; color: var(--accent);
    letter-spacing: -.01em; text-wrap: balance;
  }
  header .tag { color: var(--ink-faint); font-size: 13px; margin-top: 6px; }
  .ambient-leaf {
    position: absolute; pointer-events: none; color: var(--accent-soft); opacity: .35;
    animation: drift 6s ease-in-out infinite alternate;
  }
  .ambient-leaf.gold { color: var(--gold); }
  .ambient-leaf.l1 { top: 10px;  right: 18%; width: 22px; animation-duration: 5s; animation-delay: 0s; }
  .ambient-leaf.l2 { top: 55px;  right: 10%; width: 16px; animation-duration: 7s; animation-delay: 1.2s; }
  .ambient-leaf.l3 { top: 5px;   right: 4%;  width: 28px; animation-duration: 6s; animation-delay: .5s; }
  .ambient-leaf.l4 { top: 68px;  right: 22%; width: 14px; animation-duration: 8s; animation-delay: 2s; }
  @keyframes drift {
    from { transform: translateY(0) rotate(-4deg); }
    to   { transform: translateY(10px) rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ambient-leaf { animation: none; }
  }
  .divider { height: 6px; width: 100%; display: block; }
  .divider svg { display: block; width: 100%; height: 100%; }

  .config-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 28px; background: var(--accent-bg); border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .config-bar label { color: var(--ink-soft); display: flex; gap: 6px; align-items: center; font-weight: 500; }
  select {
    font: inherit; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink);
  }
  input:focus, textarea:focus, select:focus, button:focus-visible, .object-trigger:focus-visible {
    outline: 2px solid var(--accent-soft); outline-offset: 2px;
  }

  /* ---------- A mesa de acao (stage verde, flutua sobre a pagina clara) ---------- */
  .stage-wrap { padding: 24px 20px 64px; }
  .stage {
    max-width: 1080px; margin: 0 auto; position: relative;
    background: var(--stage-bg); border-radius: 28px; padding: 12px 28px 8px;
    box-shadow: 0 26px 50px -22px rgba(20, 14, 4, .5), -6px 8px 0 var(--sticker-shadow);
  }

  /* ---------- A cozinha (hero de objetos interativos) ---------- */
  .kitchen {
    padding: 32px 0 8px;
    display: flex; align-items: flex-start; justify-content: center; gap: 56px; flex-wrap: wrap;
  }
  .object-trigger {
    background: none; border: none; padding: 0; cursor: pointer; box-shadow: none;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    font: inherit; color: inherit;
  }
  .object-trigger:hover { background: none; box-shadow: none; transform: none; }
  .object-label {
    font: 600 13px/1 var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--stage-ink);
  }
  .object-hint { font-size: 11px; color: var(--stage-ink-soft); margin-top: -6px; }

  /* geladeira (ilustracao propria, feita pelo usuario) */
  .fridge-real {
    position: relative; width: 196px; height: 108px; margin-bottom: 4px;
    filter: drop-shadow(-5px 7px 0 var(--sticker-shadow));
    transition: transform .2s ease;
  }
  .object-trigger:hover .fridge-real { transform: translateY(-2px) scale(1.02); }
  .fridge-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    transition: opacity .4s ease;
  }
  .fridge-img--open { opacity: 0; }
  .object-card.open .fridge-img--closed { opacity: 0; }
  .object-card.open .fridge-img--open { opacity: 1; }
  .object-card.open .fridge-real { animation: wobble .5s ease; }

  /* livro de receitas (ilustracao propria, feita pelo usuario) */
  .book-real {
    position: relative; width: 196px; height: 108px; margin-bottom: 4px;
    filter: drop-shadow(-5px 7px 0 var(--sticker-shadow));
    transition: transform .2s ease;
  }
  .object-trigger:hover .book-real { transform: translateY(-2px) scale(1.02); }
  .book-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    transition: opacity .4s ease;
  }
  .book-img--open { opacity: 0; }
  .object-card.open .book-img--closed { opacity: 0; }
  .object-card.open .book-img--open { opacity: 1; }
  .object-card.open .book-real { animation: wobble .5s ease; }

  /* bloco de notas (preferencias) */
  .note-scene { width: 108px; height: 132px; perspective: 700px; margin-top: 28px; }
  .note-body { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .note-back {
    position: absolute; inset: 0; border-radius: 8px; background: var(--surface);
    border: 2.5px solid var(--ink); box-shadow: -4px 5px 0 var(--sticker-shadow);
  }
  .note-back::before {
    content: ""; position: absolute; inset: 10px; border-radius: 3px;
    background: repeating-linear-gradient(var(--bg), var(--bg) 2px, transparent 2px, transparent 8px);
    opacity: .5;
  }
  .note-cover {
    position: absolute; inset: 0; border-radius: 8px; background: var(--gold-bg);
    border: 2.5px solid var(--ink); transform-origin: top center;
    transition: transform .5s cubic-bezier(.34, 1.3, .64, 1);
    backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .note-cover span { font: 700 12px/1.3 var(--font-display); color: var(--ink-soft); text-align: center; padding: 8px; }
  .object-card.open .note-cover { transform: rotateX(-150deg); }

  @keyframes wobble {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-1.5deg); }
    60% { transform: rotate(1deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fridge-img, .book-img, .note-cover { transition: none; }
    .object-card.open .fridge-real, .object-card.open .book-real { animation: none; }
  }

  /* ---------- paineis revelados ---------- */
  .panels { padding: 8px 0 28px; display: flex; flex-direction: column; gap: 20px; }
  .object-panel {
    display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s ease;
  }
  .object-panel.open { grid-template-rows: 1fr; }
  .object-panel__inner { overflow: hidden; }
  section.card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 22px; box-shadow: -3px 3px 0 var(--sticker-shadow);
    margin-top: 4px;
  }
  section.card h2 {
    font: 600 13px/1 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--gold);
    margin: 0 0 16px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=text], input[type=number], textarea {
    font: inherit; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--ink); flex: 1; min-width: 90px;
  }
  textarea { width: 100%; min-height: 70px; resize: vertical; font-family: var(--font-body); }
  button {
    font: 600 14px/1 var(--font-body); padding: 9px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: var(--surface); cursor: pointer;
    box-shadow: -2px 2px 0 var(--sticker-shadow);
    transition: box-shadow .12s ease, transform .12s ease, background .12s ease;
  }
  button:hover { background: var(--accent-soft); box-shadow: -4px 4px 0 var(--sticker-shadow); transform: translate(1px, -1px); }
  button:active { box-shadow: -1px 1px 0 var(--sticker-shadow); transform: translate(0, 0); }
  button:disabled { opacity: .55; cursor: default; box-shadow: -2px 2px 0 var(--sticker-shadow); transform: none; }
  button.ghost {
    background: transparent; color: var(--ink-faint); border: 1px solid var(--border); font-weight: 500; padding: 4px 9px;
    box-shadow: none;
  }
  button.ghost:hover { color: var(--terracotta); border-color: var(--terracotta); background: transparent; box-shadow: none; transform: none; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  ul.list li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 11px; background: var(--surface-alt); border-radius: 8px; font-size: 13.5px;
    transition: box-shadow .12s ease, transform .12s ease;
  }
  ul.list li:hover { box-shadow: -2px 2px 0 var(--sticker-shadow); transform: translate(1px, -1px); }
  .pill {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em;
  }
  .pill.base { background: var(--terracotta-bg); color: var(--terracotta); }
  .pill.ingrediente { background: var(--gold-bg); color: var(--gold); }
  .pill.preparado { background: var(--good-bg); color: var(--good); }
  .empty { color: var(--ink-faint); font-size: 13px; padding: 8px 0; }
  .suggestion {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 16px;
    background: var(--surface-alt);
  }
  .suggestion .meta { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-faint); margin-bottom: 12px; }
  .suggestion .meta code {
    background: var(--accent-bg); color: var(--accent-soft); padding: 1px 7px; border-radius: 5px; font-size: 11.5px;
  }
  .suggestion .text { white-space: pre-wrap; font-size: 14.5px; }
  .history-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .history-item:last-child { border-bottom: none; }
  .history-item .prompt { color: var(--ink-faint); font-size: 12.5px; margin-bottom: 4px; font-style: italic; }
  .status-ok { color: var(--good); font-size: 12.5px; font-weight: 700; }
  .status-pending { color: var(--warn); font-size: 12.5px; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
  .consumo-item { border-bottom: 1px solid var(--border); padding: 10px 0; font-size: 13.5px; }
  .consumo-item:last-child { border-bottom: none; }
  .consumo-item .receita { color: var(--ink-faint); font-size: 12px; font-style: italic; margin-bottom: 5px; }
  .consumo-item .itens { display: flex; flex-wrap: wrap; gap: 6px; }
  .consumo-chip {
    font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--gold-bg); color: var(--gold);
    font-weight: 600;
  }
  .consumo-item .quando { color: var(--ink-faint); font-size: 11px; margin-top: 5px; }
</style>
</head>
<body>

<header>
  <svg class="ambient-leaf l1" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C13 2 15 7 8 16 1 7 3 2 8 0Z"/></svg>
  <svg class="ambient-leaf l2 gold" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C13 2 15 7 8 16 1 7 3 2 8 0Z"/></svg>
  <svg class="ambient-leaf l3" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C13 2 15 7 8 16 1 7 3 2 8 0Z"/></svg>
  <svg class="ambient-leaf l4 gold" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C13 2 15 7 8 16 1 7 3 2 8 0Z"/></svg>
  <h1>Chef Caseiro</h1>
  <div class="tag">produto ficticio de referencia — Evals, observabilidade e conformidade</div>
</header>
<div class="divider" aria-hidden="true">
  <svg viewBox="0 0 400 6" preserveAspectRatio="none">
    <path d="M0,3 C 25,0 50,6 75,3 S 125,0 150,3 175,6 200,3 225,0 250,3 275,6 300,3 325,0 350,3 375,6 400,3"
          fill="none" stroke="var(--gold)" stroke-width="2" />
  </svg>
</div>

<div class="config-bar">
  <strong style="color:var(--ink-soft)">Eixos ao vivo:</strong>
  <label>Prompt
    <select id="cfg-prompt">
      <option value="v1">v1</option>
      <option value="v2">v2</option>
    </select>
  </label>
  <label>Modelo de geracao
    <select id="cfg-model"></select>
  </label>
  <span id="cfg-status" style="color:var(--ink-faint)"></span>
</div>

<div class="stage-wrap">
<div class="stage">

<div class="kitchen">

  <div class="object-card" id="card-fridge">
    <button class="object-trigger" id="trigger-fridge" aria-expanded="false" aria-controls="panel-fridge">
      <div class="fridge-real">
        <img class="fridge-img fridge-img--closed" src="img/fridge-closed.png" alt="" />
        <img class="fridge-img fridge-img--open" src="img/fridge-open.png" alt="" />
      </div>
      <span class="object-label">Geladeira</span>
      <span class="object-hint">estoque da casa</span>
    </button>
  </div>

  <div class="object-card" id="card-book">
    <button class="object-trigger" id="trigger-book" aria-expanded="false" aria-controls="panel-book">
      <div class="book-real">
        <img class="book-img book-img--closed" src="img/book-closed.png" alt="" />
        <img class="book-img book-img--open" src="img/book-open.png" alt="" />
      </div>
      <span class="object-label">Livro de receitas</span>
      <span class="object-hint">pedir e revisitar sugestoes</span>
    </button>
  </div>

  <div class="object-card" id="card-note">
    <button class="object-trigger" id="trigger-note" aria-expanded="false" aria-controls="panel-note">
      <div class="note-scene">
        <div class="note-body">
          <div class="note-back"></div>
          <div class="note-cover"><span>notas da casa</span></div>
        </div>
      </div>
      <span class="object-label">Preferencias</span>
      <span class="object-hint">restricoes e gostos</span>
    </button>
  </div>

</div>

<div class="panels">

  <div class="object-panel" id="panel-fridge">
    <div class="object-panel__inner">
      <section class="card">
        <h2>Estoque</h2>
        <div class="row">
          <input type="text" id="estoque-name" placeholder="item" />
          <input type="number" id="estoque-qty" placeholder="qtd" style="max-width:70px" />
          <input type="text" id="estoque-unit" placeholder="unidade" style="max-width:90px" />
          <select id="estoque-state">
            <option value="base">base</option>
            <option value="ingrediente">ingrediente</option>
            <option value="preparado">preparado</option>
          </select>
          <button id="btn-add-estoque">+</button>
        </div>
        <ul class="list" id="estoque-list"></ul>
      </section>
      <section class="card">
        <h2>Consumo registrado</h2>
        <div id="consumos-list"><div class="empty">Carregando...</div></div>
      </section>
    </div>
  </div>

  <div class="object-panel" id="panel-book">
    <div class="object-panel__inner">
      <section class="card">
        <h2>Pedir sugestao</h2>
        <textarea id="prompt-text" placeholder="ex: vou receber um casal de amigos hoje a noite, o que consigo cozinhar com o que tenho em casa?"></textarea>
        <div class="row" style="margin-top:8px">
          <button id="btn-sugerir">Pedir sugestao</button>
          <span id="sugerir-status" style="color:var(--ink-faint); align-self:center;"></span>
        </div>
        <div id="suggestion-result"></div>
      </section>
      <section class="card">
        <h2>Historico de sugestoes</h2>
        <div id="history-list"><div class="empty">Carregando...</div></div>
      </section>
    </div>
  </div>

  <div class="object-panel" id="panel-note">
    <div class="object-panel__inner">
      <section class="card">
        <h2>Preferencias</h2>
        <div class="row">
          <input type="text" id="pref-text" placeholder="ex: sem lactose, nao gosta de coentro" />
          <button id="btn-add-pref">+</button>
        </div>
        <ul class="list" id="pref-list"></ul>
      </section>
    </div>
  </div>

</div>

</div>
</div>

<script src="app.js"></script>
</body>
</html>
